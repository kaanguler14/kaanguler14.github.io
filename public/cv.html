<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kaan Güler — Curriculum Vitae · AI Engineer · Karlsruhe, Germany">
  <title>Kaan Güler — CV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2389AACC'/><text x='50' y='52' font-family='serif' font-size='62' font-weight='700' fill='%230a0a0a' text-anchor='middle' dominant-baseline='central'>K</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      hsl(0 0% 4%);
      --surface: hsl(0 0% 8%);
      --stroke:  hsl(0 0% 12%);
      --text:    hsl(0 0% 96%);
      --muted:   hsl(0 0% 53%);
      --accent:  hsl(214 43% 67%);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--stroke);
      gap: 1rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #89AACC, #4E85BF);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: #0a0a0a;
      font-weight: 700;
      flex-shrink: 0;
      text-decoration: none;
    }

    .topbar-title {
      display: flex;
      flex-direction: column;
    }

    .topbar-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .topbar-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .topbar-sep {
      width: 1px; height: 24px;
      background: var(--stroke);
    }

    .file-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 100px;
    }

    .file-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .file-name {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-ghost {
      color: var(--muted);
      background: transparent;
    }

    .btn-ghost:hover {
      color: var(--text);
      background: var(--surface);
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    /* ── Viewer ── */
    .viewer {
      position: fixed;
      top: 57px; /* topbar height */
      left: 0; right: 0; bottom: 0;
    }

    .viewer iframe,
    .viewer object {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Fallback ── */
    .fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }

    .fallback-icon {
      font-size: 3.5rem;
      opacity: 0.3;
    }

    .fallback p {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 400px;
      line-height: 1.7;
    }

    /* Back link */
    .back-link {
      display: none;
    }

    @media (max-width: 600px) {
      .topbar-sep, .file-pill { display: none; }
      .topbar { padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="/" class="logo">KG</a>
      <div class="topbar-sep"></div>
      <div class="topbar-title">
        <span class="topbar-name">Kaan Güler</span>
        <span class="topbar-label">Curriculum Vitae</span>
      </div>
      <div class="topbar-sep"></div>
      <div class="file-pill">
        <span class="file-dot"></span>
        <span class="file-name">Kaan_Guler_CV.pdf</span>
      </div>
    </div>

    <div class="topbar-actions">
      <a href="/" class="btn btn-ghost">← Back to site</a>
      <a href="/Kaan_Guler_CV_KIRA.pdf" target="_blank" rel="noopener" class="btn btn-ghost">Open ↗</a>
      <a href="/Kaan_Guler_CV_KIRA.pdf" download="Kaan_Guler_CV.pdf" class="btn btn-primary">Download ↓</a>
    </div>
  </div>

  <!-- PDF Viewer -->
  <div class="viewer" id="viewer">
    <object
      data="/Kaan_Guler_CV_KIRA.pdf"
      type="application/pdf"
      id="pdf-object"
      style="width:100%;height:100%;"
    >
      <!-- Google Docs viewer fallback -->
      <iframe
        id="pdf-iframe"
        src="https://docs.google.com/viewer?url=https://kaanguler14.github.io/Kaan_Guler_CV_KIRA.pdf&embedded=true"
        title="Kaan Güler CV"
      ></iframe>
    </object>
  </div>

</body>
</html>
